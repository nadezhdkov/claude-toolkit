name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a changelog entry (a fragment in docs/changelog.d, or an edit of docs/CHANGELOG.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",skip-changelog,"* ]]; then
            echo "skip-changelog label present."
            exit 0
          fi
          if git diff --name-only --diff-filter=AM "$BASE"...HEAD | grep -Eqx 'docs/CHANGELOG\.md|docs/changelog\.d/[A-Za-z0-9][A-Za-z0-9_.-]*\.(added|changed|deprecated|removed|fixed|security)\.md'; then
            echo "Changelog updated."
          else
            echo "::error file=docs/changelog.d::Add docs/changelog.d/<slug>.<added|changed|fixed|...>.md (see docs/changelog.d/README.md), or ask a maintainer for the skip-changelog label (docs/CI-only changes)."
            exit 1
          fi
