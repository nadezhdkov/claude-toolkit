name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a docs/CHANGELOG.md entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if [[ ",$LABELS," == *",skip-changelog,"* ]]; then
            echo "skip-changelog label present."
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qx 'docs/CHANGELOG.md'; then
            echo "Changelog updated."
          else
            echo "::error file=docs/CHANGELOG.md::Add an entry under [Unreleased] in docs/CHANGELOG.md, or ask a maintainer for the skip-changelog label (docs/CI-only changes)."
            exit 1
          fi
