name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check install.sh
        run: shellcheck install.sh

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      # One job installs the external tools so the integration tests (ffmpeg, Xvfb,
      # ImageMagick, bubblewrap) run instead of being skipped; it fails if any test is skipped.
      - name: Install integration tools
        if: matrix.python == '3.12'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg xvfb imagemagick bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit tests
        if: matrix.python != '3.12'
        run: uv run pytest -v
      - name: Unit and integration tests (no skips allowed)
        if: matrix.python == '3.12'
        shell: bash
        env:
          # No desktop here to show "low on memory" notifications: test a real OOM kill.
          CTK_TEST_OOM: "1"
        run: |
          uv run pytest -v -rs | tee pytest.log
          if grep -q ' SKIPPED' pytest.log; then
            echo "::error::integration tests were skipped; check the tools installed above"
            exit 1
          fi

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Installer dry run
        run: ./install.sh --dry-run
      - name: Install ctk as a uv tool and smoke-test every command
        run: |
          uv tool install --editable .
          ctk --version
          uv sync
          ctk doctor .
          ctk lsp . || true
          ctk runq -- python3 -c "print('hello from runq')"
          ctk setup --dry-run
          ctk sessions --since 1
