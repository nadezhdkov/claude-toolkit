name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check shell scripts
        run: shellcheck install.sh plugin/bin/ctk benchmark/cases/*/setup.sh benchmark/cases/*/checks/*.sh

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      # One job installs the external tools so the integration tests (ffmpeg, Xvfb,
      # ImageMagick, bubblewrap) run instead of being skipped; it fails if any test is skipped.
      - name: Install integration tools
        if: matrix.python == '3.12'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ffmpeg xvfb imagemagick bubblewrap fish zsh
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Unit tests
        if: matrix.python != '3.12'
        run: uv run pytest -v
      - name: Unit and integration tests (no skips allowed)
        if: matrix.python == '3.12'
        shell: bash
        env:
          # No desktop here to show "low on memory" notifications: test a real OOM kill.
          CTK_TEST_OOM: "1"
        run: |
          uv run pytest -v -rs | tee pytest.log
          if grep -q ' SKIPPED' pytest.log; then
            echo "::error::integration tests were skipped; check the tools installed above"
            exit 1
          fi

  test-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Unit tests
        run: uv run pytest -v -rs

  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Installer dry run
        run: ./install.sh --dry-run
      - name: Install ctk as a uv tool and smoke-test every command
        run: |
          uv tool install --editable .
          ctk --version
          uv sync
          ctk doctor .
          ctk lsp . || true
          ctk runq -- python3 -c "print('hello from runq')"
          ctk setup --dry-run
          ctk sessions --since 1

  install-os:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
      - name: Installer dry run and confirmation without a terminal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $null | pwsh -NoProfile -File ./install.ps1
          if ($LASTEXITCODE -ne 3) { Write-Error "expected exit 3, got $LASTEXITCODE"; exit 1 }
          exit 0
      - name: Installer dry run (macOS)
        if: runner.os == 'macOS'
        run: ./install.sh --dry-run
      - name: Install ctk as a uv tool
        shell: bash
        run: |
          uv tool install --editable .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Smoke-test the commands and the plugin launcher (Git Bash on Windows)
        shell: bash
        run: |
          ctk --version
          uv sync
          ctk doctor .
          ctk runq -- git --version
          ctk setup --dry-run
          ctk map . --budget 20
          ctk verify || test $? -eq 1
          plugin/bin/ctk --version
          echo '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"ls"}}' | ctk hook guard-destructive

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build, check the metadata and install the wheel in a clean environment
        run: |
          uv build
          uvx --from twine==7.0.0 twine check --strict dist/*
          uv venv "$RUNNER_TEMP/clean"
          uv pip install --python "$RUNNER_TEMP/clean/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/ctk" --version
          "$RUNNER_TEMP/clean/bin/ctk" doctor "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/ctk" setup --dry-run
