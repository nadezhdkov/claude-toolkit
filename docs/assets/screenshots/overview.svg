<svg xmlns="http://www.w3.org/2000/svg" width="859" height="556" viewBox="0 0 859 556">
<rect width="859" height="556" rx="10" fill="#0f172a"/>
<circle cx="20" cy="18" r="6" fill="#f87171"/><circle cx="40" cy="18" r="6" fill="#fbbf24"/><circle cx="60" cy="18" r="6" fill="#4ade80"/>
<text x="429.5" y="22" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, sans-serif" font-size="12">ctk</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<text x="18" y="56" textLength="184.8"><tspan fill="#38bdf8" font-weight="bold">◆</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">claude-toolkit</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#94a3b8">0.3.0</tspan></text>
<text x="18" y="75" textLength="378.0"><tspan fill="#e2e8f0">  </tspan><tspan fill="#94a3b8">Tools that make Claude Code more effective.</tspan></text>
<text x="18" y="113" textLength="84.0"><tspan fill="#e2e8f0">  </tspan><tspan fill="#38bdf8" font-weight="bold">Commands</tspan></text>
<text x="18" y="132" textLength="663.6"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">doctor    </tspan><tspan fill="#e2e8f0">  toolchain pins vs installed versions, dependencies vs lockfiles</tspan></text>
<text x="18" y="151" textLength="638.4"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">runq      </tspan><tspan fill="#e2e8f0">  run a command; print failures, summary and the full-log path</tspan></text>
<text x="18" y="170" textLength="638.4"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">lsp       </tspan><tspan fill="#e2e8f0">  language servers and Claude Code LSP plugins a project needs</tspan></text>
<text x="18" y="189" textLength="537.6"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">sessions  </tspan><tspan fill="#e2e8f0">  counts-only metrics from Claude Code transcripts</tspan></text>
<text x="18" y="208" textLength="756.0"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">shoot     </tspan><tspan fill="#e2e8f0">  deterministic screenshots (web, Godot, desktop), baselines, contact sheets</tspan></text>
<text x="18" y="227" textLength="722.4"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">audiocheck</tspan><tspan fill="#e2e8f0">  loudness, clipping, silence and loop seams of audio files, plus images</tspan></text>
<text x="18" y="246" textLength="722.4"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">sandbox   </tspan><tspan fill="#e2e8f0">  run untrusted code without network, with a read-only system and limits</tspan></text>
<text x="18" y="265" textLength="714.0"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">libdocs   </tspan><tspan fill="#e2e8f0">  installed version, README and API of a dependency, from its own files</tspan></text>
<text x="18" y="284" textLength="730.8000000000001"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">map       </tspan><tspan fill="#e2e8f0">  compact map of a repository&#x27;s files and symbols; where a symbol is used</tspan></text>
<text x="18" y="303" textLength="747.6"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">verify    </tspan><tspan fill="#e2e8f0">  what is verified for the current code: fresh, failing, stale or never run</tspan></text>
<text x="18" y="322" textLength="823.2"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">diffcheck </tspan><tspan fill="#e2e8f0">  deterministic checks of a change: removed API, risky files, debug leftovers, tests</tspan></text>
<text x="18" y="341" textLength="697.2"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">relay     </tspan><tspan fill="#e2e8f0">  hand the work over to a fresh Claude Code session in a new terminal</tspan></text>
<text x="18" y="360" textLength="630.0"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">setup     </tspan><tspan fill="#e2e8f0">  wire the toolkit into Claude Code (asks before each change)</tspan></text>
<text x="18" y="379" textLength="663.6"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">hook      </tspan><tspan fill="#e2e8f0">  logic behind the Claude Code plugin hooks (event JSON on stdin)</tspan></text>
<text x="18" y="417" textLength="84.0"><tspan fill="#e2e8f0">  </tspan><tspan fill="#38bdf8" font-weight="bold">Examples</tspan></text>
<text x="18" y="436" textLength="218.4"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk doctor ~/project</tspan></text>
<text x="18" y="455" textLength="201.60000000000002"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk runq -- pytest</tspan></text>
<text x="18" y="474" textLength="193.20000000000002"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk lsp --install</tspan></text>
<text x="18" y="493" textLength="243.60000000000002"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk sessions --since 30</tspan></text>
<text x="18" y="531" textLength="680.4"><tspan fill="#e2e8f0">  </tspan><tspan fill="#94a3b8">Help:</tspan><tspan fill="#e2e8f0"> ctk &lt;command&gt; --help   </tspan><tspan fill="#94a3b8">Docs:</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">https://github.com/nadezhdkov/claude-toolkit</tspan></text>
</g></svg>