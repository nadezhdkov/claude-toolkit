<svg xmlns="http://www.w3.org/2000/svg" width="716" height="404" viewBox="0 0 716 404">
<rect width="716" height="404" rx="10" fill="#0f172a"/>
<circle cx="20" cy="18" r="6" fill="#f87171"/><circle cx="40" cy="18" r="6" fill="#fbbf24"/><circle cx="60" cy="18" r="6" fill="#4ade80"/>
<text x="358.0" y="22" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, sans-serif" font-size="12">ctk</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" xml:space="preserve">
<text x="18" y="56" textLength="184.8"><tspan fill="#38bdf8" font-weight="bold">◆</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">claude-toolkit</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#94a3b8">0.2.0</tspan></text>
<text x="18" y="75" textLength="378.0"><tspan fill="#e2e8f0">  </tspan><tspan fill="#94a3b8">Tools that make Claude Code more effective.</tspan></text>
<text x="18" y="113" textLength="84.0"><tspan fill="#e2e8f0">  </tspan><tspan fill="#38bdf8" font-weight="bold">Commands</tspan></text>
<text x="18" y="132" textLength="646.8000000000001"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">doctor  </tspan><tspan fill="#e2e8f0">  toolchain pins vs installed versions, dependencies vs lockfiles</tspan></text>
<text x="18" y="151" textLength="621.6"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">runq    </tspan><tspan fill="#e2e8f0">  run a command; print failures, summary and the full-log path</tspan></text>
<text x="18" y="170" textLength="621.6"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">lsp     </tspan><tspan fill="#e2e8f0">  language servers and Claude Code LSP plugins a project needs</tspan></text>
<text x="18" y="189" textLength="520.8000000000001"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">sessions</tspan><tspan fill="#e2e8f0">  counts-only metrics from Claude Code transcripts</tspan></text>
<text x="18" y="208" textLength="613.2"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">setup   </tspan><tspan fill="#e2e8f0">  wire the toolkit into Claude Code (asks before each change)</tspan></text>
<text x="18" y="227" textLength="646.8000000000001"><tspan fill="#e2e8f0">    </tspan><tspan fill="#22d3ee">hook    </tspan><tspan fill="#e2e8f0">  logic behind the Claude Code plugin hooks (event JSON on stdin)</tspan></text>
<text x="18" y="265" textLength="84.0"><tspan fill="#e2e8f0">  </tspan><tspan fill="#38bdf8" font-weight="bold">Examples</tspan></text>
<text x="18" y="284" textLength="218.4"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk doctor ~/project</tspan></text>
<text x="18" y="303" textLength="201.60000000000002"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk runq -- pytest</tspan></text>
<text x="18" y="322" textLength="193.20000000000002"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk lsp --install</tspan></text>
<text x="18" y="341" textLength="243.60000000000002"><tspan fill="#e2e8f0">    </tspan><tspan fill="#38bdf8">$</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#e2e8f0" font-weight="bold">ctk sessions --since 30</tspan></text>
<text x="18" y="379" textLength="680.4"><tspan fill="#e2e8f0">  </tspan><tspan fill="#94a3b8">Help:</tspan><tspan fill="#e2e8f0"> ctk &lt;command&gt; --help   </tspan><tspan fill="#94a3b8">Docs:</tspan><tspan fill="#e2e8f0"> </tspan><tspan fill="#22d3ee">https://github.com/nadezhdkov/claude-toolkit</tspan></text>
</g></svg>